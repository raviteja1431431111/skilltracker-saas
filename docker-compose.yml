version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:8080"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=dev-secret-key-docker-2026
      - DATABASE_URL=postgresql://skilltracker:skilltracker_pass@db:5432/skilltracker_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=skilltracker
      - POSTGRES_PASSWORD=skilltracker_pass
      - POSTGRES_DB=skilltracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
